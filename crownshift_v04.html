<!doctype html>

<head>

<title>CROWN//SHIFT v0.4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#24283a,#0a0b10 45%,#06070a 80%);color:#f5f0df;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;overscroll-behavior:none}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);touch-action:manipulation}#app{width:min(100%,460px);margin:auto;padding:12px 14px 28px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:end}.logo{font-size:30px;font-weight:1000;letter-spacing:-1.8px}.logo b{color:#f1c15d}.ver{font-size:9px;color:#7f879a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.st{background:#151821;border:1px solid #2b3040;border-radius:12px;text-align:center;padding:7px 3px}.k{font-size:8px;color:#838a9b;letter-spacing:.8px}.v{font-size:17px;font-weight:900}.score .v{color:#f1c15d}.bar{height:7px;background:#151821;border:1px solid #252a37;border-radius:10px;overflow:hidden;margin:7px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#d99b37,#f4d579);transition:.2s}.msg{height:38px;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:800;color:#f0c86b}.boardwrap{position:relative;background:#11141b;border:1px solid #292e3b;border-radius:20px;padding:10px;box-shadow:0 18px 45px #0008}.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;touch-action:none}.cell{aspect-ratio:1;border-radius:11px;border:1px solid #2c3241;background:linear-gradient(145deg,#171a23,#0e1016);display:grid;place-items:center;position:relative;font-size:26px;font-weight:900;overflow:hidden;transition:.08s}.cell.drop{border-color:#f1c15d;box-shadow:inset 0 0 0 2px #f1c15d44,0 0 18px #f1c15d33;background:#242117}.cell.attack{background:#152333;border-color:#3c7395}.cell.victim{border-color:#ff6479;background:#32171e;box-shadow:inset 0 0 0 2px #ff647944,0 0 18px #ff5f7566}.target{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ff7a8c,#9e2538 55%,#3a1118);color:white;font-size:11px;font-weight:1000;box-shadow:0 0 15px #ff5f7560}.piece{filter:drop-shadow(0 0 8px currentColor)}.cell.fire{animation:fire .25s ease}.cell.hit{animation:hit .25s ease}@keyframes fire{50%{transform:scale(1.12);filter:brightness(1.7)}}@keyframes hit{50%{transform:scale(.82);filter:brightness(2)}}#lines{position:absolute;inset:10px;pointer-events:none;overflow:visible;z-index:3}.beam{stroke:#65d2ff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px #65d2ff);opacity:.85}.beam.hit{stroke:#ff6d82;stroke-width:4}.beam.chain{stroke:#f1c15d;stroke-width:4}.draw{text-align:center;color:#72798a;font-size:9px;letter-spacing:2px;margin:10px 0 6px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.h{height:72px;border-radius:14px;border:1px solid #32394a;background:linear-gradient(#1b1f29,#11141a);color:#fff;font-size:28px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;position:relative}.h small{font-size:8px;color:#9299a9;letter-spacing:.8px;margin-top:2px}.h.dragging{opacity:.25}.hint{text-align:center;margin-top:8px;color:#8f96a6;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{height:46px;border-radius:13px;border:1px solid #343a49;background:#202532;color:#d8dce6;font-weight:900}.restart{grid-column:1/-1;background:#f1c15d;color:#171309;border:0}.toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font-size:34px;font-weight:1000;color:#f1c15d;text-shadow:0 4px 24px #000,0 0 20px currentColor;opacity:0;pointer-events:none;z-index:30}.toast.go{animation:toast .75s ease}@keyframes toast{20%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}.ghost{position:fixed;z-index:50;width:58px;height:58px;border-radius:17px;background:#20242e;border:2px solid #f1c15d;display:grid;place-items:center;font-size:35px;font-weight:1000;pointer-events:none;transform:translate(-50%,-115%);box-shadow:0 15px 30px #000b,0 0 20px #f1c15d44}.ghost.bad{border-color:#ff667a}.upgrade{display:none;margin-top:8px;background:#13161e;border:1px solid #2e3442;border-radius:17px;padding:10px}.upgrade.show{display:block}.pick{width:100%;margin-top:6px;padding:9px;border-radius:11px;border:1px solid #343b4b;background:#1b1f2a;color:#efeadc;text-align:left}.pick b{color:#f1c15d}.pick span{display:block;font-size:10px;color:#aab0bf;margin-top:2px}#tutorialToggle{position:fixed;opacity:0;pointer-events:none}.coach{position:fixed;inset:0;background:#05060af2;z-index:100;display:grid;place-items:center;padding:20px}.coachbox{width:min(100%,360px);background:#13161e;border:1px solid #343a4a;border-radius:20px;padding:18px;text-align:center}.coach strong{display:block;font-size:20px}.coach p{font-size:11px;color:#adb3c0;margin:7px 0 12px}.demo{height:170px;position:relative}.demoHand{position:absolute;left:25px;bottom:12px;width:70px;height:60px;border-radius:14px;background:#1b1f29;border:1px solid #384052;display:grid;place-items:center;font-size:32px;color:#73e1a3}.demoCell{position:absolute;right:72px;top:24px;width:64px;height:64px;border-radius:12px;border:2px solid #f1c15d;background:#1a1d25}.demoTarget{position:absolute;right:18px;top:42px;width:28px;height:28px;border-radius:50%;background:#d83e55;box-shadow:0 0 15px #ff5e76}.demoFinger{position:absolute;left:55px;bottom:28px;font-size:30px;animation:dragdemo 2.2s ease-in-out infinite}.demoBeam{position:absolute;right:39px;top:55px;width:85px;height:3px;background:#65d2ff;box-shadow:0 0 8px #65d2ff;opacity:0;animation:beamdemo 2.2s ease-in-out infinite}@keyframes dragdemo{0%,12%{transform:translate(0,0)}55%,75%{transform:translate(175px,-92px)}100%{transform:translate(0,0)}}@keyframes beamdemo{0%,48%{opacity:0}58%,78%{opacity:1}90%,100%{opacity:0}}.start{display:grid;place-items:center;width:100%;height:50px;border-radius:14px;background:#f1c15d;color:#171309;font-weight:1000;font-size:15px;cursor:pointer}#tutorialToggle:checked + .coach{display:none}
</style>
</head>
<body>
<div id="app"><div class="top"><div class="logo">CROWN<b>//SHIFT</b></div><div class="ver">v0.4</div></div><div class="stats"><div class="st"><div class="k">ROUND</div><div class="v" id="round">1/5</div></div><div class="st"><div class="k">TARGET</div><div class="v" id="target">260</div></div><div class="st score"><div class="k">SCORE</div><div class="v" id="score">0</div></div><div class="st"><div class="k">MOVES</div><div class="v" id="moves">6</div></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="msg" id="msg">Trascina un pezzo sulla griglia.</div><div class="boardwrap"><svg id="lines"></svg><div class="board" id="board"></div></div><div class="draw">WEAPONS</div><div class="hand" id="hand"></div><div class="hint">TIENI PREMUTO • TRASCINA • GUARDA LA PREVIEW • LASCIA</div><div class="actions"><button class="btn" id="reroll">REROLL</button><button class="btn" id="reset">RESET ROUND</button><button class="btn restart" id="restart" hidden>NEW RUN</button></div><div class="upgrade" id="upgrade"></div></div><div class="toast" id="toast"></div><input id="tutorialToggle" type="checkbox"><div class="coach"><div class="coachbox"><strong>TRASCINA. MIRA. LASCIA.</strong><div class="demo"><div class="demoHand">♖</div><div class="demoCell"></div><div class="demoTarget"></div><div class="demoBeam"></div><div class="demoFinger">☝️</div></div><p>Tieni il pezzo col dito. Spostalo sopra una casella. Prima di lasciarlo vedrai esattamente dove sparerà.</p><label class="start" for="tutorialToggle">GOT IT</label></div></div>
<script>
const N=5;const TYPES={P:{g:'♙',n:'PAWN',c:'#8bd3ff'},N:{g:'♘',n:'KNIGHT',c:'#f3ce68'},B:{g:'♗',n:'BISHOP',c:'#d38cff'},R:{g:'♖',n:'ROOK',c:'#73e1a3'},K:{g:'♔',n:'KING',c:'#ff8d8d'},Q:{g:'♕',n:'QUEEN',c:'#fff'}};const BAG=['P','P','N','N','B','B','R','R','K','Q'];const UP=[['POWER','OVERDRIVE','Ogni bersaglio +25%.'],['CHAIN','CHAIN REACTOR','Le catene moltiplicano di più.'],['KNIGHT','FORK ENGINE','Cavallo ×1.6.'],['ROOK','CASTLE GUN','Torre ×1.6.']];let B=[],H=[],round=1,target=260,score=0,moves=6,arts=[],locked=false,drag=null,hover=-1;const $=x=>document.getElementById(x),BE=$('board'),HE=$('hand'),SVG=$('lines');function rnd(n){return Math.floor(Math.random()*n)}function idx(r,c){return r>=0&&r<N&&c>=0&&c<N?r*N+c:-1}function rc(i){return[Math.floor(i/N),i%N]}function draw(){return BAG[rnd(BAG.length)]}function newHand(){H=[draw(),draw(),draw()];renderHand()}function spawnTargets(n=7){let e=[];B.forEach((x,i)=>{if(!x)e.push(i)});while(n--&&e.length){let k=rnd(e.length),i=e.splice(k,1)[0];B[i]={kind:'target',val:1+rnd(3)}}}function startRound(){B=Array(25).fill(null);score=0;moves=6;locked=false;target=Math.floor(260*Math.pow(1.65,round-1));spawnTargets(7);newHand();$('upgrade').className='upgrade';$('restart').hidden=true;msg('Trascina un pezzo sulla griglia.');render()}function rayFrom(i,dirs){let hits=[],path=[],p=rc(i),r=p[0],c=p[1];for(const d of dirs){let rr=r+d[0],cc=c+d[1];while(rr>=0&&rr<N&&cc>=0&&cc<N){let j=idx(rr,cc);path.push(j);if(B[j]){hits.push(j);break}rr+=d[0];cc+=d[1]}}return{hits,path}}function attackInfo(i,t){let p=rc(i),r=p[0],c=p[1],hits=[],path=[];function add(j){if(j>=0){path.push(j);if(B[j])hits.push(j)}}if(t==='R'||t==='Q'){let z=rayFrom(i,[[1,0],[-1,0],[0,1],[0,-1]]);hits.push(...z.hits);path.push(...z.path)}if(t==='B'||t==='Q'){let z=rayFrom(i,[[1,1],[1,-1],[-1,1],[-1,-1]]);hits.push(...z.hits);path.push(...z.path)}if(t==='N')for(const d of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(idx(r+d[0],c+d[1]));if(t==='K')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)add(idx(r+a,c+b));if(t==='P'){add(idx(r-1,c-1));add(idx(r-1,c+1))}return{hits:[...new Set(hits)],path:[...new Set(path)]}}function render(){BE.innerHTML='';B.forEach((x,i)=>{let d=document.createElement('div');d.className='cell';d.dataset.i=i;if(x&&x.kind==='target')d.innerHTML='<div class="target">'+(x.val*30)+'</div>';if(x&&x.kind==='piece'){let T=TYPES[x.type];d.innerHTML='<span class="piece" style="color:'+T.c+'">'+T.g+'</span>'}BE.appendChild(d)});stats();renderHand()}function renderHand(){HE.innerHTML='';H.forEach((t,i)=>{let T=TYPES[t],d=document.createElement('div');d.className='h';d.dataset.h=i;d.innerHTML='<span style="color:'+T.c+'">'+T.g+'</span><small>'+T.n+'</small>';d.addEventListener('pointerdown',e=>beginDrag(e,i));HE.appendChild(d)})}function beginDrag(e,hi){if(locked)return;e.preventDefault();const src=e.currentTarget;try{src.setPointerCapture(e.pointerId)}catch(_){ }let t=H[hi],T=TYPES[t],g=document.createElement('div');g.className='ghost';g.innerHTML='<span style="color:'+T.c+'">'+T.g+'</span>';document.body.appendChild(g);drag={hi,type:t,ghost:g,source:src,pid:e.pointerId};src.classList.add('dragging');moveGhost(e.clientX,e.clientY);previewAtPoint(e.clientX,e.clientY);document.addEventListener('pointermove',dragMove,{passive:false});document.addEventListener('pointerup',dragEnd,{passive:false,once:true});document.addEventListener('pointercancel',dragEnd,{passive:false,once:true})}function dragMove(e){if(!drag)return;e.preventDefault();moveGhost(e.clientX,e.clientY);previewAtPoint(e.clientX,e.clientY)}function moveGhost(x,y){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}function previewAtPoint(x,y){clearPreview();let el=document.elementFromPoint(x,y),cell=el&&el.closest?el.closest('.cell'):null;if(!cell||B[+cell.dataset.i]){hover=-1;if(drag)drag.ghost.classList.add('bad');return}drag.ghost.classList.remove('bad');hover=+cell.dataset.i;cell.classList.add('drop');let info=attackInfo(hover,drag.type);info.path.forEach(i=>{if(BE.children[i])BE.children[i].classList.add('attack')});info.hits.forEach(i=>{if(BE.children[i])BE.children[i].classList.add('victim')});drawPreviewLines(hover,info)}function cellCenter(i){let r=BE.children[i].getBoundingClientRect(),b=BE.getBoundingClientRect();return{x:r.left+r.width/2-b.left,y:r.top+r.height/2-b.top}}function drawPreviewLines(from,info){SVG.innerHTML='';let a=cellCenter(from);for(const j of info.hits){let b=cellCenter(j),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('class','beam hit');SVG.appendChild(l)}}function clearPreview(){hover=-1;SVG.innerHTML='';[...BE.children].forEach(c=>c.classList.remove('drop','attack','victim'))}function dragEnd(e){if(!drag)return;e.preventDefault();let d=drag,place=hover;document.removeEventListener('pointermove',dragMove);d.source.classList.remove('dragging');d.ghost.remove();drag=null;clearPreview();if(place>=0&&!B[place])commit(place,d.hi,d.type);else msg('Lascialo su una casella vuota.')}function commit(i,hi,t){B[i]={kind:'piece',type:t};moves--;H.splice(hi,1);H.push(draw());render();locked=true;setTimeout(()=>resolve(i),70)}async function resolve(i){let visited=new Set,g=await fire(i,1,visited);if(g)toast('+'+g);while(B.filter(x=>x&&x.kind==='target').length<7)spawnTargets(1);render();locked=false;if(score>=target)win();else if(moves<=0)lose();else msg('Trascina il prossimo pezzo.')}async function fire(i,depth,visited){if(visited.has(i)||!B[i]||B[i].kind!=='piece')return 0;visited.add(i);let t=B[i].type;flash(i,'fire');await wait(80);let info=attackInfo(i,t),gain=0;for(const j of info.hits){let x=B[j];drawShot(i,j,x&&x.kind==='piece'?'chain':'hit');await wait(80);if(!x)continue;if(x.kind==='target'){let pts=x.val*30,mult=1+(depth-1)*(arts.includes('CHAIN')?.85:.55);if(arts.includes('POWER'))mult*=1.25;if(t==='N'&&arts.includes('KNIGHT'))mult*=1.6;if(t==='R'&&arts.includes('ROOK'))mult*=1.6;pts=Math.floor(pts*mult);score+=pts;gain+=pts;flash(j,'hit');B[j]=null;stats()}else if(x.kind==='piece'&&!visited.has(j)){gain+=await fire(j,depth+1,visited)}}return gain}function drawShot(a,b,kind){let p=cellCenter(a),q=cellCenter(b),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',p.x);l.setAttribute('y1',p.y);l.setAttribute('x2',q.x);l.setAttribute('y2',q.y);l.setAttribute('class','beam '+kind);SVG.appendChild(l);setTimeout(()=>l.remove(),260)}function flash(i,c){if(BE.children[i])BE.children[i].classList.add(c);setTimeout(()=>{if(BE.children[i])BE.children[i].classList.remove(c)},260)}function stats(){$('round').textContent=round+'/5';$('target').textContent=target;$('score').textContent=score;$('moves').textContent=moves;$('fill').style.width=Math.min(100,score/target*100)+'%'}function msg(t){$('msg').textContent=t}function toast(t){let x=$('toast');x.textContent=t;x.className='toast';void x.offsetWidth;x.className='toast go'}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function win(){locked=true;if(round>=5){msg('RUN COMPLETE');$('restart').hidden=false;toast('CROWN!');return}let box=$('upgrade'),pool=[...UP].sort(()=>Math.random()-.5).slice(0,3);box.className='upgrade show';box.innerHTML='<b>SCEGLI UN RULEBREAKER</b>';pool.forEach(u=>{let b=document.createElement('button');b.className='pick';b.innerHTML='<b>'+u[1]+'</b><span>'+u[2]+'</span>';b.onclick=()=>{arts.push(u[0]);round++;startRound()};box.appendChild(b)})}function lose(){locked=true;msg('RUN OVER');$('restart').hidden=false}$('reroll').onclick=()=>{if(!locked){newHand();msg('Nuove armi.')}};$('reset').onclick=startRound;$('restart').onclick=()=>{round=1;arts=[];startRound()};startRound();
</script>
</body>
