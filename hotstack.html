<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>HOTSTACK</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;background:#090a0e;color:#f6efdc;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#a{max-width:440px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 28px}.top{display:flex;justify-content:space-between;align-items:end}.logo{font-size:33px;font-weight:1000;letter-spacing:-2px}.logo b{color:#f5c35b}.mini{font-size:9px;color:#7f8596}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px}.st{background:#151821;border:1px solid #292e3b;border-radius:12px;text-align:center;padding:7px 3px}.k{font-size:8px;color:#858b9b}.v{font-size:18px;font-weight:900}.bar{height:7px;background:#171a23;border-radius:9px;overflow:hidden}.fill{height:100%;background:#f5c35b;width:0;transition:.25s}.msg{height:48px;display:grid;place-items:center;text-align:center;color:#f5c35b;font-size:12px;font-weight:700}.box{background:#13161e;border:1px solid #2a2f3c;border-radius:20px;padding:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cell{aspect-ratio:1;border:1px solid #303647;border-radius:13px;background:#10131a;color:#fff;font-size:25px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center}.cell small{font-size:12px;color:#fff;margin-top:2px}.empty{color:#343948;font-weight:300}.draw{text-align:center;color:#6c7282;font-size:9px;letter-spacing:2px;margin:10px 0 6px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.h{height:68px;background:#191d27;border:1px solid #32394b;border-radius:14px;font-size:23px;font-weight:900;color:#fff}.h.sel{border:2px solid #f5c35b;transform:translateY(-3px)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.act{border:0;border-radius:14px;height:50px;font-size:15px;font-weight:1000}.bank{background:#f5c35b}.press{background:#e94f65;color:white}.restart{grid-column:1/-1;background:#eee5d1}.shop{display:none;margin-top:9px;background:#13161e;border:1px solid #303647;border-radius:16px;padding:10px}.shop.show{display:block}.pick{display:block;width:100%;margin-top:6px;padding:9px;border-radius:11px;border:1px solid #343a4b;background:#1a1e29;color:#eee;text-align:left}.pick b{color:#f5c35b}.rig{font-size:10px;color:#9da3b1;margin-top:8px;white-space:nowrap;overflow:auto}.toast{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);font-size:35px;font-weight:1000;color:#f5c35b;opacity:0;pointer-events:none}.toast.go{animation:t .7s}@keyframes t{20%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-70%)}}button:active{transform:scale(.97)}</style></head><body><div id="a"><div class="top"><div class="logo">HOT<b>STACK</b></div><div class="mini">PLAYTEST v0.1</div></div><div class="stats"><div class="st"><div class="k">ROUND</div><div class="v" id="r">1</div></div><div class="st"><div class="k">TARGET</div><div class="v" id="t">80</div></div><div class="st"><div class="k">SCORE</div><div class="v" id="s">0</div></div><div class="st"><div class="k">MOVES</div><div class="v" id="m">10</div></div></div><div class="bar"><div class="fill" id="f"></div></div><div class="rig" id="rig">RIG: none</div><div class="msg" id="msg">Pick a chip, then place it. Connect 3+ matching symbols.</div><div class="box"><div class="grid" id="g"></div><div class="draw">DRAW</div><div class="hand" id="h"></div></div><div class="actions"><button class="act bank" id="bank" hidden>BANK</button><button class="act press" id="press" hidden>PRESS ×1.75</button><button class="act restart" id="restart" hidden>NEW RUN</button></div><div class="shop" id="shop"></div></div><div class="toast" id="toast"></div><script>const S=[['●','#f6c85f'],['▲','#67d7f5'],['★','#ec75ae'],['◆','#988cff']],A=[['EDGE','EDGE LORD','Edge clears ×1.5'],['TRIAD','TRIPLE THREAT','Exactly 3 ×2'],['SEVEN','LUCKY 7','7s count twice'],['ECHO','ECHO CHAMBER','First clear +50%'],['RED','REDLINE','Stars ×1.75'],['COMP','COMPOUND','Stronger chain scaling']];let B,H,sel,R=1,T,sc,M,ch,arts=[],first,over,hit;const $=x=>document.getElementById(x),G=$('g'),HE=$('h');function C(){return{s:Math.floor(Math.random()*4),v:1+Math.floor(Math.random()*9)}}function hand(){H=[C(),C(),C()];sel=-1;rh()}function start(){B=Array(16).fill(null);T=Math.floor(80*1.65**(R-1));sc=0;M=10;ch=0;first=0;over=0;hit=0;$('shop').className='shop';$('bank').hidden=$('press').hidden=$('restart').hidden=true;$('msg').textContent='Pick a chip, then place it. Connect 3+ matching symbols.';hand();ren()}function nb(i){let r=i>>2,c=i&3,a=[];if(r)a.push(i-4);if(r<3)a.push(i+4);if(c)a.push(i-1);if(c<3)a.push(i+1);return a}function comp(i,s){let o=[],q=[i],z=new Set;while(q.length){let x=q.pop();if(z.has(x))continue;z.add(x);if(!B[x]||B[x].s!=s)continue;o.push(x);nb(x).forEach(n=>q.push(n))}return o}function place(i){if(over||hit||sel<0||B[i])return;let c=H[sel];B[i]={...c};sc+=c.v;M--;let co=comp(i,c.s);if(co.length>=3)clear(co,c.s);else ch=0;hand();ren();if(sc>=T)target();else if(M<=0)lose('TARGET MISSED')}function clear(co,su){ch++;let sum=0,edge=0;co.forEach(i=>{let v=B[i].v;sum+=v;if(arts.includes('SEVEN')&&v==7)sum+=7;let r=i>>2,c=i&3;if(!r||r==3||!c||c==3)edge=1});let mult=co.length*(1+(ch-1)*(arts.includes('COMP')?.35:.18));if(arts.includes('EDGE')&&edge)mult*=1.5;if(arts.includes('TRIAD')&&co.length==3)mult*=2;if(arts.includes('RED')&&su==2)mult*=1.75;let gain=Math.floor(sum*mult);if(arts.includes('ECHO')&&!first)gain+=Math.floor(gain/2);first=1;sc+=gain;co.forEach(i=>B[i]=null);$('msg').textContent=`CLEAR ${co.length} • CHAIN ×${ch} • +${gain}`;toast('+'+gain)}function target(){hit=1;$('bank').hidden=0;$('press').hidden=M<=0;$('msg').textContent='TARGET HIT — BANK safely or PRESS your luck.';toast('TARGET!')}function bank(){hit=0;$('bank').hidden=$('press').hidden=1;shop()}function press(){T=Math.floor(T*1.75);M+=3;hit=0;$('bank').hidden=$('press').hidden=1;$('msg').textContent='PRESS ACTIVE — miss the new target and the run ends.';ren();toast('PRESS!')}function shop(){let p=[...A].sort(()=>Math.random()-.5).slice(0,3),x=$('shop');x.className='shop show';x.innerHTML='<b>CHOOSE ONE RULEBREAKER</b>';p.forEach(a=>{let b=document.createElement('button');b.className='pick';b.innerHTML=`<b>${a[1]}</b><br><small>${a[2]}</small>`;b.onclick=()=>{if(!arts.includes(a[0]))arts.push(a[0]);R++;start()};x.appendChild(b)})}function lose(t){over=1;$('msg').textContent=t;$('restart').hidden=0}function toast(t){let x=$('toast');x.textContent=t;x.className='toast';void x.offsetWidth;x.className='toast go'}function ren(){$('r').textContent=R;$('t').textContent=T;$('s').textContent=sc;$('m').textContent=M;$('f').style.width=Math.min(100,sc/T*100)+'%';$('rig').textContent='RIG: '+(arts.length?arts.map(id=>A.find(a=>a[0]==id)[1]).join(' • '):'none');G.innerHTML='';B.forEach((c,i)=>{let b=document.createElement('button');b.className='cell'+(c?'':' empty');b.innerHTML=c?`<span style="color:${S[c.s][1]}">${S[c.s][0]}</span><small>${c.v}</small>`:'+';b.onclick=()=>place(i);G.appendChild(b)});rh()}function rh(){HE.innerHTML='';H.forEach((c,i)=>{let b=document.createElement('button');b.className='h'+(i==sel?' sel':'');b.style.color=S[c.s][1];b.textContent=S[c.s][0]+' '+c.v;b.onclick=()=>{sel=i;rh()};HE.appendChild(b)})}$('bank').onclick=bank;$('press').onclick=press;$('restart').onclick=()=>{R=1;arts=[];start()};start();</script></body></html>
