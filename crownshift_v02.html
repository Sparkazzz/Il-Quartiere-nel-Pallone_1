<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07080c"><title>CROWN//SHIFT v0.2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#202437,#090a10 48%,#050609 86%);color:#f4efdf;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#app{width:min(100%,460px);margin:auto;padding:10px 12px 24px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:end}.logo{font-size:29px;font-weight:1000;letter-spacing:-1.7px}.logo b{color:#f1c15d}.ver{font-size:9px;color:#777f92}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.st{background:#151820;border:1px solid #2a3040;border-radius:12px;text-align:center;padding:6px 2px}.k{font-size:7px;color:#81889b;letter-spacing:.8px}.v{font-size:17px;font-weight:950;margin-top:1px}.score .v{color:#f1c15d}.bar{height:7px;background:#151821;border:1px solid #272c38;border-radius:10px;overflow:hidden;margin:7px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#e29e34,#f6d77b);transition:.2s}.msg{height:34px;display:grid;place-items:center;text-align:center;color:#efc96f;font-size:11px;font-weight:800}.wrap{position:relative;background:#11141b;border:1px solid #2b3040;border-radius:21px;padding:9px;box-shadow:0 18px 45px #0009;overflow:hidden}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:relative;z-index:2}.cell{aspect-ratio:1;border-radius:11px;border:1px solid #2d3343;background:linear-gradient(145deg,#171b24,#0d1016);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:28px;font-weight:950;transition:.14s}.cell.valid{border-color:#d5aa50;box-shadow:inset 0 0 0 2px #d5aa5033,0 0 13px #d5aa5022}.cell.path:after{content:"";width:13px;height:13px;border-radius:50%;background:#f1c15d66;box-shadow:0 0 14px #f1c15d99}.cell.target{background:radial-gradient(circle,#401c27,#201018 64%,#100b0f);border-color:#733748}.core{font-size:17px;color:#ff6a80;text-shadow:0 0 14px #ff566e}.cell.target small{position:absolute;bottom:3px;right:4px;font-size:8px;color:#ffc2ca}.piece{filter:drop-shadow(0 0 8px currentColor)}.cell.fire{animation:fire .34s ease}.cell.hit{animation:hit .36s ease}.cell.chain{animation:chain .4s ease}@keyframes fire{45%{transform:scale(1.16);filter:brightness(1.8)}100%{transform:scale(1)}}@keyframes hit{40%{transform:scale(.72);filter:brightness(3)}75%{transform:scale(1.08)}}@keyframes chain{35%{box-shadow:0 0 0 3px #f1c15d66,0 0 26px #f1c15dcc;transform:scale(1.13)}}#fx{position:absolute;inset:9px;pointer-events:none;z-index:6;overflow:visible}.beam{stroke:#f1c15d;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 5px #f1c15d);stroke-dasharray:200;stroke-dashoffset:200;animation:beam .22s ease forwards}@keyframes beam{to{stroke-dashoffset:0}}.beam2{stroke:#83e4ff}.beam3{stroke:#ef7cff}.draw{font-size:8px;color:#6f7688;letter-spacing:2px;text-align:center;margin:9px 0 5px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.h{height:66px;border-radius:14px;border:1px solid #33394a;background:linear-gradient(#1b1f2a,#11141b);color:#fff;font-size:27px;font-weight:950;position:relative;transition:.13s}.h small{display:block;font-size:8px;color:#9299aa;letter-spacing:.5px}.h.sel{border:2px solid #f1c15d;transform:translateY(-4px);box-shadow:0 9px 22px #0008,0 0 18px #f1c15d33}.movestrip{height:24px;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:5px;color:#7f8798;font-size:8px}.dot{width:5px;height:5px;border-radius:50%;background:#343a48}.dot.on{background:#f1c15d;box-shadow:0 0 7px #f1c15d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{height:47px;border:0;border-radius:13px;font-weight:950;font-size:13px}.reroll{background:#202532;color:#e1e4ea;border:1px solid #343a49}.demoBtn{background:#eee6d4;color:#131419}.restart{grid-column:1/-1;background:#f1c15d;color:#171309}.rig{font-size:8px;color:#7d8597;margin-top:7px;white-space:nowrap;overflow:auto}.up{display:none;background:#13161e;border:1px solid #2f3544;border-radius:16px;padding:9px;margin-top:8px}.up.show{display:block}.up h3{font-size:10px;text-align:center;margin:0 0 6px;color:#d9dde6}.pick{width:100%;text-align:left;border:1px solid #343a4a;background:#1a1e29;color:#eee6d5;border-radius:11px;padding:9px;margin-top:6px}.pick b{display:block;color:#f1c15d;font-size:11px}.pick span{display:block;color:#9da4b4;font-size:9px;margin-top:2px}.toast{position:fixed;left:50%;top:23%;transform:translate(-50%,-50%);font-size:38px;font-weight:1000;color:#f1c15d;text-shadow:0 4px 28px #000,0 0 22px currentColor;opacity:0;pointer-events:none;z-index:30}.toast.go{animation:toast .8s ease}@keyframes toast{15%{opacity:1;transform:translate(-50%,-50%) scale(.75)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.22)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}.floatx{position:fixed;z-index:31;font-size:30px;font-weight:1000;color:#fff;pointer-events:none;text-shadow:0 4px 18px #000;animation:floatx .75s ease forwards}@keyframes floatx{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}30%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-32px) scale(.9)}}.demo{position:fixed;inset:0;background:#05060af7;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.demo.hide{display:none}.democard{width:min(100%,410px);background:#11141c;border:1px solid #343a4a;border-radius:23px;padding:14px;box-shadow:0 30px 80px #000}.demotop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.demologo{font-size:22px;font-weight:1000}.demologo b{color:#f1c15d}.skip{border:0;background:#202532;color:#bfc4ce;border-radius:999px;padding:7px 10px;font-size:9px}.demoboard{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#090b10;padding:8px;border-radius:17px;border:1px solid #2b3140;position:relative}.dc{aspect-ratio:1;border-radius:9px;background:#151922;border:1px solid #2c3241;display:grid;place-items:center;font-size:24px;position:relative}.dc.glow{border-color:#f1c15d;box-shadow:0 0 18px #f1c15d66}.dc.hit{animation:hit .4s ease}.demotext{height:48px;display:grid;place-items:center;text-align:center;font-size:16px;font-weight:1000;color:#f3eddd;letter-spacing:-.2px}.demotext b{color:#f1c15d}.play{width:100%;height:49px;border:0;border-radius:14px;background:#f1c15d;color:#171309;font-weight:1000;font-size:15px;display:none}.play.show{display:block}.ghost{position:absolute;z-index:5;font-size:27px;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px currentColor)}.footer{text-align:center;color:#505664;font-size:8px;margin-top:9px}</style></head><body><div id="app"><div class="top"><div class="logo">CROWN<b>//SHIFT</b></div><div class="ver">VISUAL TEST 0.2</div></div><div class="stats"><div class="st"><div class="k">ROUND</div><div class="v" id="round">1/5</div></div><div class="st"><div class="k">TARGET</div><div class="v" id="target">300</div></div><div class="st score"><div class="k">SCORE</div><div class="v" id="score">0</div></div><div class="st"><div class="k">MOVES</div><div class="v" id="moves">6</div></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="rig" id="rig">RIG: —</div><div class="msg" id="msg">Scegli un pezzo.</div><div class="wrap"><svg id="fx"></svg><div class="board" id="board"></div><div class="movestrip" id="movestrip"></div><div class="draw">WEAPONS</div><div class="hand" id="hand"></div></div><div class="actions"><button class="btn reroll" id="reroll">REROLL 1</button><button class="btn demoBtn" id="demoBtn">▶ DEMO</button><button class="btn restart" id="restart" hidden>NEW RUN</button></div><div class="up" id="up"></div><div class="footer">Prototype visuale — gli scacchi sono armi, non una partita a scacchi</div></div><div class="toast" id="toast"></div><div class="demo" id="demo"><div class="democard"><div class="demotop"><div class="demologo">CROWN<b>//SHIFT</b></div><button class="skip" id="skip">SKIP</button></div><div class="demoboard" id="demoboard"></div><div class="demotext" id="demotext"></div><button class="play" id="play">GIOCA</button></div></div><script>const N=5,TYPES={P:{g:'♙',n:'PAWN',c:'#83d7ff'},N:{g:'♘',n:'KNIGHT',c:'#f4cc65'},B:{g:'♗',n:'BISHOP',c:'#d58cff'},R:{g:'♖',n:'ROOK',c:'#74e3a5'},K:{g:'♔',n:'KING',c:'#ff8e8e'},Q:{g:'♕',n:'QUEEN',c:'#fff'}},BAG=['P','P','N','N','B','B','R','R','K','Q'],UP=[['N','FORK ENGINE','Cavalli ×1.7'],['R','RAILGUN','Torri ×1.7'],['B','DIAGONAL FEVER','Alfieri ×1.7'],['P','PAWN BOMB','Pedoni ×2'],['C','CHAIN REACTOR','Catene crescono più in fretta'],['Q','BLACK QUEEN','Regina ×2.2']];let B=[],H=[],sel=-1,round=1,target=300,score=0,moves=6,rerolls=1,arts=[],locked=0;const $=x=>document.getElementById(x),BE=$('board'),HE=$('hand'),FX=$('fx');function rnd(n){return Math.floor(Math.random()*n)}function rc(i){return[Math.floor(i/N),i%N]}function idx(r,c){return r>=0&&r<N&&c>=0&&c<N?r*N+c:-1}function piece(){return BAG[rnd(BAG.length)]}function buzz(v=25){try{navigator.vibrate?.(v)}catch(e){}}function tone(f=500,d=.06){try{let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);setTimeout(()=>a.close(),200)}catch(e){}}function rayCells(i,dirs,stop=true){let out=[],[r,c]=rc(i);for(const[dR,dC]of dirs){let rr=r+dR,cc=c+dC;while(rr>=0&&rr<N&&cc>=0&&cc<N){let j=idx(rr,cc);out.push(j);if(stop&&B[j])break;rr+=dR;cc+=dC}}return out}function attackSquares(i,t,forPreview=false){let[r,c]=rc(i),o=[];if(t==='R'||t==='Q')o.push(...rayCells(i,[[1,0],[-1,0],[0,1],[0,-1]],!forPreview));if(t==='B'||t==='Q')o.push(...rayCells(i,[[1,1],[1,-1],[-1,1],[-1,-1]],!forPreview));if(t==='N')for(const[a,b]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){let j=idx(r+a,c+b);if(j>=0)o.push(j)}if(t==='K')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b){let j=idx(r+a,c+b);if(j>=0)o.push(j)}if(t==='P')for(const b of[-1,1]){let j=idx(r-1,c+b);if(j>=0)o.push(j)}return[...new Set(o)]}function attackTargets(i,t){return attackSquares(i,t,false).filter(j=>B[j])}function spawnTargets(n=7){let e=[];B.forEach((x,i)=>{if(!x)e.push(i)});while(n--&&e.length){let p=rnd(e.length),i=e.splice(p,1)[0];B[i]={k:'t',v:1+rnd(3)}}}function drawHand(){H=[piece(),piece(),piece()];sel=-1;renderHand();clearPreview()}function startRound(){B=Array(25).fill(null);score=0;moves=6;rerolls=1;locked=0;target=Math.floor(300*Math.pow(1.72,round-1));$('up').className='up';$('restart').hidden=true;$('reroll').disabled=false;spawnTargets(7);drawHand();$('msg').textContent='Scegli un pezzo.';render()}function render(){$('round').textContent=round+'/5';$('target').textContent=target;$('score').textContent=score;$('moves').textContent=moves;$('fill').style.width=Math.min(100,score/target*100)+'%';$('rig').textContent='RIG: '+(arts.length?arts.map(a=>UP.find(x=>x[0]===a)?.[1]||a).join(' • '):'—');BE.innerHTML='';B.forEach((x,i)=>{let b=document.createElement('button');b.className='cell '+(!x?'empty':x.k==='t'?'target':'');if(x?.k==='t')b.innerHTML=`<span class="core">◆</span><small>${x.v*30}</small>`;if(x?.k==='p')b.innerHTML=`<span class="piece" style="color:${TYPES[x.t].c}">${TYPES[x.t].g}</span>`;b.onclick=()=>place(i);BE.appendChild(b)});renderHand()}function renderHand(){HE.innerHTML='';H.forEach((t,i)=>{let b=document.createElement('button');b.className='h'+(i===sel?' sel':'');b.innerHTML=`<span style="color:${TYPES[t].c}">${TYPES[t].g}</span><small>${TYPES[t].n}</small>`;b.onclick=()=>{sel=i;renderHand();preview(t)};HE.appendChild(b)})}function clearPreview(){[...BE.children].forEach(c=>c.classList.remove('valid','path'));$('movestrip').innerHTML=''}function preview(t){clearPreview();[...BE.children].forEach((c,i)=>{if(!B[i])c.classList.add('valid')});let sample=t==='R'?'↕ ↔':t==='B'?'↖ ↗ ↘ ↙':t==='N'?'L  L  L':t==='Q'?'✦ 8 DIR':t==='K'?'1 STEP':'↖ ↗';$('movestrip').innerHTML=`<span style="color:${TYPES[t].c};font-weight:900;font-size:11px">${TYPES[t].g}</span><span>${sample}</span>`;$('msg').textContent='Tocca una casella libera.'}function center(i){let r=BE.children[i].getBoundingClientRect(),s=FX.getBoundingClientRect();return{x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top}}function beam(a,b,depth=1){let A=center(a),C=center(b),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',A.x);l.setAttribute('y1',A.y);l.setAttribute('x2',C.x);l.setAttribute('y2',C.y);l.setAttribute('class','beam '+(depth===2?'beam2':depth>=3?'beam3':''));FX.appendChild(l);setTimeout(()=>l.remove(),360)}function flash(i,cl){let c=BE.children[i];if(!c)return;c.classList.remove(cl);void c.offsetWidth;c.classList.add(cl);setTimeout(()=>c.classList.remove(cl),420)}function floatX(i,d){let r=BE.children[i].getBoundingClientRect(),x=document.createElement('div');x.className='floatx';x.textContent='×'+d;x.style.left=(r.left+r.width/2)+'px';x.style.top=(r.top+5)+'px';document.body.appendChild(x);setTimeout(()=>x.remove(),780)}function place(i){if(locked||sel<0||B[i])return;let t=H[sel];B[i]={k:'p',t};moves--;tone(320,0.04);buzz(15);drawHand();render();setTimeout(()=>resolve(i),120)}async function resolve(i){locked=1;let visited=new Set,g=await fire(i,1,visited);if(g)toast('+'+g);while(B.filter(x=>x?.k==='t').length<7)spawnTargets(1);render();locked=0;if(score>=target)win();else if(moves<=0)lose();else $('msg').textContent='Scegli il prossimo pezzo.'}async function fire(i,d,visited){if(visited.has(i)||B[i]?.k!=='p')return 0;visited.add(i);flash(i,d>1?'chain':'fire');if(d>1)floatX(i,d);await wait(130);let t=B[i].t,ts=attackTargets(i,t),gain=0;for(const j of ts){beam(i,j,d);await wait(90);let x=B[j];if(!x)continue;if(x.k==='t'){flash(j,'hit');let mult=1+(d-1)*(arts.includes('C')?.9:.55),tm=arts.includes(t)?(t==='Q'?2.2:t==='P'?2:1.7):1,pts=Math.floor(x.v*30*mult*tm);score+=pts;gain+=pts;B[j]=null;updateScore();tone(520+d*90,.05);buzz(25)}else if(x.k==='p'&&!visited.has(j)){gain+=await fire(j,d+1,visited)}}return gain}function updateScore(){$('score').textContent=score;$('fill').style.width=Math.min(100,score/target*100)+'%'}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function toast(t){let x=$('toast');x.textContent=t;x.className='toast';void x.offsetWidth;x.className='toast go'}function win(){locked=1;toast('ROUND CLEAR');$('msg').textContent='Scegli un upgrade.';let p=[...UP].sort(()=>Math.random()-.5).slice(0,3),u=$('up');u.className='up show';u.innerHTML='<h3>RULEBREAKER</h3>';p.forEach(a=>{let b=document.createElement('button');b.className='pick';b.innerHTML=`<b>${a[1]}</b><span>${a[2]}</span>`;b.onclick=()=>{if(!arts.includes(a[0]))arts.push(a[0]);if(round>=5){toast('RUN COMPLETE');$('msg').textContent='RUN COMPLETA';$('restart').hidden=false;return}round++;startRound()};u.appendChild(b)})}function lose(){locked=1;$('msg').textContent='TARGET MISSED';$('restart').hidden=false;toast('GAME OVER')}function demoBoard(){let D=$('demoboard');D.innerHTML='';for(let i=0;i<25;i++){let c=document.createElement('div');c.className='dc';D.appendChild(c)}return D}async function runDemo(){let D=demoBoard(),T=$('demotext'),P=$('play');P.className='play';let cells=[...D.children],set=(i,html)=>cells[i].innerHTML=html,hi=(i,on=1)=>cells[i].classList.toggle('glow',!!on);T.innerHTML='';await wait(350);T.innerHTML='<b>1.</b> PIAZZA UNA TORRE';set(22,'<span style="color:#74e3a5">♖</span>');hi(22);await wait(850);hi(22,0);[2,7,12,17].forEach(i=>hi(i));T.innerHTML='LA TORRE <b>SPARA IN LINEA</b>';await wait(900);set(2,'<span style="color:#ff6a80">◆</span>');cells[2].classList.add('hit');await wait(650);[2,7,12,17].forEach(i=>hi(i,0));cells[2].innerHTML='';T.innerHTML='';D.innerHTML='';for(let i=0;i<25;i++){let c=document.createElement('div');c.className='dc';D.appendChild(c)}cells=[...D.children];set=(i,html)=>cells[i].innerHTML=html;hi=(i,on=1)=>cells[i].classList.toggle('glow',!!on);await wait(250);T.innerHTML='<b>2.</b> IL CAVALLO USA LA L';set(17,'<span style="color:#f4cc65">♘</span>');[6,8,10,14].forEach(i=>hi(i));await wait(950);[6,8,10,14].forEach(i=>hi(i,0));D.innerHTML='';for(let i=0;i<25;i++){let c=document.createElement('div');c.className='dc';D.appendChild(c)}cells=[...D.children];set=(i,html)=>cells[i].innerHTML=html;hi=(i,on=1)=>cells[i].classList.toggle('glow',!!on);set(22,'<span style="color:#74e3a5">♖</span>');set(12,'<span style="color:#f4cc65">♘</span>');set(4,'<span style="color:#ff6a80">◆</span>');T.innerHTML='<b>3.</b> COLPISCI UN TUO PEZZO';hi(22);await wait(650);hi(22,0);hi(12);cells[12].classList.add('hit');T.innerHTML='E LUI <b>SPARA DI NUOVO</b>';await wait(650);hi(12,0);hi(4);cells[4].classList.add('hit');T.innerHTML='<b>CATENA ×2</b>';await wait(850);P.className='play show';T.innerHTML='ORA FALLO TU.'}function closeDemo(){$('demo').classList.add('hide');startRound()}$('reroll').onclick=()=>{if(rerolls<=0||locked)return;rerolls--;drawHand();$('reroll').textContent='REROLL 0';$('reroll').disabled=true};$('restart').onclick=()=>{round=1;arts=[];startRound()};$('demoBtn').onclick=()=>{$('demo').classList.remove('hide');runDemo()};$('skip').onclick=closeDemo;$('play').onclick=closeDemo;runDemo();</script></body></html>
